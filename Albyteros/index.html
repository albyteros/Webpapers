<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Albyteros</title>
<style>
  html, body { margin: 0; height: 100vh; overflow: hidden; background: black; }
  body { display: flex; justify-content: center; align-items: center; }
  pre {
    font: bold 2.2vw monospace;
    animation: colorCycle 6s infinite alternate;
    user-select: none;
  }
  @keyframes colorCycle {
    0%   { color: red; }
    14%  { color: orange; }
    28%  { color: yellow; }
    42%  { color: green; }
    57%  { color: blue; }
    71%  { color: indigo; }
    85%  { color: violet; }
    100% { color: white; }
  }
</style>
</head>
<body>
<pre>
    ___    ____          __                      
   /   |  / / /_  __  __/ /____  _________  _____
  / /| | / / __ \/ / / / __/ _ \/ ___/ __ \/ ___/
 / ___ |/ / /_/ / /_/ / /_/  __/ /  / /_/ (__  ) 
/_/  |_/_/_.___/\__, /\__/\___/_/   \____/____/  
               /____/                            
    </pre>
</body>
</html>
