<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Webpaper Template</title>
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; inset: 0; }
  #clock {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font: 200 12vmin/1 ui-monospace, Consolas, monospace; color: rgba(255,255,255,0.9);
    text-align: center; user-select: none;
  }
  #date { font-size: 0.18em; letter-spacing: 0.3em; opacity: 0.6; margin-top: 0.8em; }
  #credit {
    position: fixed; left: 24px; bottom: 22px;
    font: 12px ui-monospace, Consolas, monospace; color: rgba(255,255,255,0.3);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="clock"><div id="time"></div><div id="date"></div></div>
<div id="credit">"WEBPAPER TEMPLATE" BY ALBYTEROS</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let w, h;

  // sharp on Retina: full-resolution backing store, scaled back to CSS pixels
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    w = innerWidth; h = innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  // 1. Background colour follows the time of day
  const SKY = [                     // [hour, top, bottom]
    [0,  '#05060f', '#0d1230'],
    [6,  '#2a3f7a', '#f39060'],
    [12, '#2f7fd6', '#bfe0fb'],
    [18, '#3a2d5c', '#f08a5d'],
    [21, '#0a0f2a', '#1b1f4a'],
    [24, '#05060f', '#0d1230'],
  ];
  const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const mix = (a, b, t) => `rgb(${hex(a).map((v, i) => v + (hex(b)[i] - v) * t).join(',')})`;

  function drawSky(now) {
    const hr = now.getHours() + now.getMinutes() / 60;
    const i = SKY.findIndex(k => k[0] > hr) - 1;
    const [h0, top0, bot0] = SKY[i], [h1, top1, bot1] = SKY[i + 1];
    const t = (hr - h0) / (h1 - h0);
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, mix(top0, top1, t));
    g.addColorStop(1, mix(bot0, bot1, t));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }

  // 2. A live clock, drawn with plain HTML on top of the canvas
  function updateClock(now) {
    document.getElementById('time').textContent =
      now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    document.getElementById('date').textContent =
      now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' }).toUpperCase();
  }

  // Main loop. requestAnimationFrame already stops while the page is hidden.
  function frame() {
    const now = new Date();
    drawSky(now);
    updateClock(now);
    requestAnimationFrame(frame);
  }
  frame();
</script>
</body>
</html>
